name: huntapi
image: mcp/huntapi
type: server
meta:
  category: media
  tags:
    - huntapi
    - video-download-api
    - audio-download-api
    - media-metadata
    - async-api
about:
  title: HuntAPI
  description: Download video and audio from public media URLs, or extract their metadata, with one async REST API.
  icon: https://raw.githubusercontent.com/huntapi/huntapi-mcp/main/assets/icon-400.png
source:
  project: https://github.com/huntapi/huntapi-mcp
run:
  allowHosts:
    - api.huntapi.com:443
config:
  description: Configure your HuntAPI API key.
  secrets:
    - name: huntapi.api_key
      env: HUNTAPI_API_KEY
      example: YOUR_API_KEY
      description: Required API key from https://app.huntapi.com.
      required: true
